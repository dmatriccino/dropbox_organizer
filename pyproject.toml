[project]
name = "dropbox-organizer"
version = "0.2.0"
description = "Read-only Dropbox duplicate-media report tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["dropbox==12.2.5"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
